<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catat Cuan — Pribadi</title>
  <!-- Logo / Favicon Tab Browser -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><text y='.9em' x='12' font-size='78'>💸</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 1. FORM LOGIN -->
    <div id="loginSection">
      <header class="app-header">
        <h1>🔒 Catat Cuan</h1>
        <p>Masuk ke akunmu</p>
      </header>
      <form id="formLogin" class="form-group">
        <input type="text" id="loginUser" placeholder="Username" required>
        <input type="password" id="loginPass" placeholder="Password" required>
        <button type="submit" id="btnLogin" class="btn-masuk">Masuk</button>
        <p style="text-align: center; font-size: 13px; color: #94a3b8; margin-top: 8px;">
          Belum punya akun? <a href="#" id="linkKeRegister" style="color: #38bdf8; text-decoration: none; font-weight: bold;">Daftar di sini</a>
        </p>
      </form>
    </div>

    <!-- 2. FORM REGISTER -->
    <div id="registerSection" style="display: none;">
      <header class="app-header">
        <h1>📝 Daftar Akun</h1>
        <p>Buat akun baru untuk mencatat keuanganmu</p>
      </header>
      <form id="formRegister" class="form-group">
        <input type="text" id="regUser" placeholder="Buat Username (min. 3 huruf)" required>
        <input type="password" id="regPass" placeholder="Buat Password (min. 3 karakter)" required>
        <button type="submit" id="btnRegister" class="btn-masuk" style="background-color: #38bdf8; color: #0f172a;">Daftar Sekarang</button>
        <p style="text-align: center; font-size: 13px; color: #94a3b8; margin-top: 8px;">
          Sudah punya akun? <a href="#" id="linkKeLogin" style="color: #38bdf8; text-decoration: none; font-weight: bold;">Masuk di sini</a>
        </p>
      </form>
    </div>

    <!-- 3. APLIKASI UTAMA -->
    <div id="appSection" style="display: none;">
      <header class="app-header" style="display: flex; justify-content: space-between; align-items: center; text-align: left;">
        <div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <h1 style="margin: 0;">Catat Cuan</h1>
            <span id="badgeRole" style="font-size: 10px; padding: 3px 8px; border-radius: 99px; font-weight: bold; text-transform: uppercase;">USER</span>
          </div>
          <p id="sapaanUser">Halo!</p>
        </div>
        <button id="btnLogout" class="btn-keluar" style="flex: none; padding: 8px 12px; font-size: 12px;">Keluar</button>
      </header>

      <div id="adminPanel" style="display: none; background: #0f172a; border: 1px dashed #38bdf8; padding: 12px; border-radius: 10px; margin-bottom: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <small style="color: #38bdf8; font-weight: bold;">🛡️ Panel Developer / Admin</small>
          <small id="totalUserText" style="color: #94a3b8;">Memuat user...</small>
        </div>
        <div id="listUserAdmin" style="font-size: 12px; color: #cbd5e1; margin-top: 6px;"></div>
      </div>

      <div class="saldo-card">
        <span>Sisa Saldo Saat Ini</span>
        <h2 id="sisaSaldo">Rp 0</h2>
      </div>

      <div class="form-group">
        <input type="text" id="namaItem" placeholder="Keterangan (misal: Gaji, Nasi Padang)">
        <input type="text" id="nominal" inputmode="numeric" placeholder="Nominal (Rp)">
        <div class="btn-row">
          <button type="button" id="btnMasuk" class="btn-masuk">+ Pemasukan</button>
          <button type="button" id="btnKeluar" class="btn-keluar">- Pengeluaran</button>
        </div>
      </div>

      <div class="riwayat-section">
        <h3>Riwayat Transaksi</h3>
        <ul id="daftarTransaksi"></ul>
      </div>

      <!-- Credit Developer -->
    <footer class="dev-credit">
      Developed by <a href="https://github.com/cena2876" target="_blank">Cen</a> ⚡
    </footer>
  </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
